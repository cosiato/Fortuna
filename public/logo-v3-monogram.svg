<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC000"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="purpleMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="goldVertical" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#6D28D9" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hexClip">
      <path d="M256,36 L446,146 L446,366 L256,476 L66,366 L66,146 Z"/>
    </clipPath>
  </defs>

  <!-- Background glow -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)"/>

  <!-- Hexagonal frame -->
  <path d="M256,36 L446,146 L446,366 L256,476 L66,366 L66,146 Z"
        stroke="url(#goldMain)" stroke-width="4" fill="none"/>
  <path d="M256,52 L434,154 L434,358 L256,460 L78,358 L78,154 Z"
        stroke="url(#goldMain)" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Corner accents on hexagon -->
  <g fill="url(#goldMain)">
    <circle cx="256" cy="36" r="6"/>
    <circle cx="446" cy="146" r="6"/>
    <circle cx="446" cy="366" r="6"/>
    <circle cx="256" cy="476" r="6"/>
    <circle cx="66" cy="366" r="6"/>
    <circle cx="66" cy="146" r="6"/>
  </g>

  <!-- Stylized "F" letterform -->
  <g transform="translate(256, 248)">
    <!-- Main vertical stroke of F -->
    <path d="
      M -50,-140
      L -30,-140
      L -30,140
      L -50,140
      Z
    " fill="url(#goldMain)"/>

    <!-- Top horizontal stroke of F (with decorative serif) -->
    <path d="
      M -55,-140
      L 80,-140
      L 80,-120
      L -30,-120
      L -55,-120
      Z
    " fill="url(#goldMain)"/>

    <!-- Middle horizontal stroke of F (shorter) -->
    <path d="
      M -35,-20
      L 55,-20
      L 55,0
      L -30,0
      Z
    " fill="url(#goldMain)"/>

    <!-- Decorative serif at top-left -->
    <path d="M-55,-148 L-55,-112 Q-62,-130 -55,-148Z" fill="url(#goldMain)" opacity="0.6"/>

    <!-- Decorative serif at bottom -->
    <path d="M-58,132 L-22,132 L-22,148 L-58,148Z" fill="url(#goldMain)"/>

    <!-- Top serif -->
    <path d="M-55,-148 L85,-148 L85,-140 L-55,-140Z" fill="url(#goldMain)" opacity="0.7"/>

    <!-- Wheel of Fortune integrated into F -->
    <!-- Small wheel at the intersection point -->
    <circle cx="55" cy="-10" r="38" stroke="url(#goldMain)" stroke-width="3" fill="none"/>
    <circle cx="55" cy="-10" r="30" stroke="url(#goldMain)" stroke-width="1.5" fill="none" opacity="0.4"/>
    <circle cx="55" cy="-10" r="8" fill="url(#goldMain)" opacity="0.6"/>

    <!-- Mini spokes -->
    <g stroke="url(#goldMain)" stroke-width="1.5" opacity="0.5">
      <line x1="55" y1="-48" x2="55" y2="28"/>
      <line x1="17" y1="-10" x2="93" y2="-10"/>
      <line x1="28.1" y1="-37.1" x2="81.9" y2="17.1"/>
      <line x1="81.9" y1="-37.1" x2="28.1" y2="17.1"/>
    </g>

    <!-- Spoke end dots -->
    <g fill="url(#goldMain)" opacity="0.7">
      <circle cx="55" cy="-48" r="3"/>
      <circle cx="55" cy="28" r="3"/>
      <circle cx="17" cy="-10" r="3"/>
      <circle cx="93" cy="-10" r="3"/>
    </g>
  </g>

  <!-- Decorative line accents (top and bottom of hex) -->
  <g stroke="url(#goldMain)" stroke-width="1" opacity="0.3">
    <line x1="140" y1="70" x2="372" y2="70"/>
    <line x1="140" y1="442" x2="372" y2="442"/>
  </g>

  <!-- Small text at bottom -->
  <text x="256" y="438" font-family="serif" font-size="18" fill="url(#goldMain)"
        text-anchor="middle" letter-spacing="12" opacity="0.6">FORTUNA</text>
</svg>
